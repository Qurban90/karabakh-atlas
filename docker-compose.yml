# Qarabağ Dirçəliş Xəritəsi — full stack (Postgres + API + nginx client)
#   docker compose up --build
#   → app:  http://localhost:8080
#   → api:  http://localhost:5001/api  ·  docs: http://localhost:5001/api/docs
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qdx
      POSTGRES_PASSWORD: qdx
      POSTGRES_DB: qdx
    volumes:
      - qdx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qdx -d qdx']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgres://qdx:qdx@db:5432/qdx
      # required: compose refuses to start without it (the API rejects weak secrets)
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. export JWT_SECRET=$(openssl rand -base64 36)}
      CORS_ORIGIN: '*'
    ports:
      - '5001:5001'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mobile:
    build: ./mobile
    depends_on:
      - server
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  qdx-pgdata:
