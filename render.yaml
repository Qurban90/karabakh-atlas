# Render.com blueprint — web service + managed Postgres.
# The API also serves the built app (server/src/app.js bundles mobile/dist),
# so one web service hosts everything; PORT is injected by Render.
#
# NOTE (existing services): Blueprints don't retro-sync settings into an
# already-created service. If qdx-app predates the databases block below,
# create the database once in the dashboard (New → PostgreSQL, Free) and add
# its Internal Database URL to qdx-app as the DATABASE_URL env var.
#
# NOTE (build): mobile/.npmrc pins include=dev because Render injects
# NODE_ENV=production into the build step, which would otherwise make npm
# omit vite/typescript devDependencies and break `tsc && vite build`.
databases:
  - name: qdx-db
    plan: free
    databaseName: qdx
    user: qdx

services:
  - type: web
    name: qdx-app
    runtime: node
    buildCommand: npm install --prefix server && npm install --include=dev --prefix mobile && npm run build --prefix mobile
    startCommand: npm run start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: qdx-db
          property: connectionString
